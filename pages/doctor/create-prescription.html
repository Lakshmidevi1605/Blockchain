<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Prescription — RxChain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/doctor.css">
</head>
<body class="dash-body">

<div class="dash-shell">
  <aside class="dash-sidebar">
    <a href="../../index.html" class="dash-brand"><span class="brand-mark">Rx</span>RxChain</a>
    <span class="dash-role-badge">Doctor</span>
    <ul class="dash-nav">
      <li><a href="doctor-dashboard.html"><span class="nav-icon">▤</span>Dashboard</a></li>
      <li><a href="create-prescription.html" class="active"><span class="nav-icon">+</span>Create Prescription</a></li>
      <li><a href="patient-records.html"><span class="nav-icon">☰</span>Patient Records</a></li>
      <li><a href="ai-analysis.html"><span class="nav-icon">✦</span>AI Analysis</a></li>
      <li><a href="blockchain-storage.html"><span class="nav-icon">◆</span>Blockchain Ledger</a></li>
    </ul>
    <div class="dash-sidebar-footer">
      <div class="dash-user"><span class="u-name" id="sbUserName">—</span><span class="u-role">Doctor</span></div>
      <a href="#" class="dash-signout" id="signOutBtn">Sign out</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <h1>Create prescription</h1>
        <p class="sub">This will be hashed and written to the ledger the moment you submit.</p>
      </div>
    </div>

    <div class="panel" style="max-width:720px;">
      <details id="newPatientBox">
        <summary style="cursor:pointer;font-weight:600;">+ Register a new patient</summary>
        <div class="form-grid" style="margin-top:14px;">
          <div class="field"><label for="npName">Full name</label><input type="text" id="npName" placeholder="e.g. Ravi Kumar"></div>
          <div class="field"><label for="npDob">Date of birth</label><input type="date" id="npDob"></div>
          <div class="field"><label for="npPass">Login password (min 6)</label><input type="text" id="npPass" placeholder="Give this to the patient"></div>
          <div class="field" style="align-self:end;"><button type="button" class="btn btn-outline" id="npBtn">Create patient</button></div>
        </div>
        <p id="npMsg" class="sub" style="margin:10px 0 0;"></p>
      </details>
    </div>

    <div class="panel" style="max-width:720px;">
      <div class="form-status" id="formStatus" style="display:none;"></div>
      <form id="rxForm">
        <div class="form-grid">
          <div class="field">
            <label for="patientId">Patient</label>
            <select id="patientId" required><option value="">Loading patients…</option></select>
          </div>
          <div class="field">
            <label for="patientName">Patient name</label>
            <input type="text" id="patientName" placeholder="Filled automatically" readonly>
          </div>
          <div class="field">
            <label for="medication">Medication</label>
            <input type="text" id="medication" placeholder="e.g. Amoxicillin" required>
          </div>
          <div class="field">
            <label for="dosage">Dosage</label>
            <input type="text" id="dosage" placeholder="e.g. 500mg" required>
          </div>
          <div class="field">
            <label for="frequency">Frequency</label>
            <input type="text" id="frequency" placeholder="e.g. 3x daily" required>
          </div>
          <div class="field">
            <label for="duration">Duration</label>
            <input type="text" id="duration" placeholder="e.g. 7 days" required>
          </div>
          <div class="field span-2">
            <label for="notes">Notes for pharmacist / patient</label>
            <textarea id="notes" placeholder="e.g. Take after food. Complete full course."></textarea>
          </div>
        </div>
        <div style="margin-top:22px; display:flex; gap:12px;">
          <button type="submit" class="btn btn-primary">Sign &amp; write to chain</button>
          <a href="doctor-dashboard.html" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="../../js/doctor/blockchain.js"></script>
<script src="../../js/doctor/patient-picker.js"></script>
<script src="../../js/doctor/prescription.js"></script>
</body>
</html>
