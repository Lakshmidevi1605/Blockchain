<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — RxChain</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>

<body>

  <main class="login-page">

    <div class="login-card">

      <!-- Brand -->
      <div class="login-header">

        <a href="../index.html" class="login-brand">
          <span class="brand-mark">Rx</span>
          RxChain
        </a>

        <h1>Welcome back</h1>

        <p>
          Sign in to access your RxChain account.
        </p>

      </div>


      <!-- Role Selection -->
      <div class="role-tabs">

        <button
          type="button"
          class="role-tab active"
          data-role="doctor">
          Doctor
        </button>

        <button
          type="button"
          class="role-tab"
          data-role="patient">
          Patient
        </button>

        <button
          type="button"
          class="role-tab"
          data-role="pharmacy">
          Pharmacy
        </button>

        <button
          type="button"
          class="role-tab"
          data-role="admin">
          Admin
        </button>

      </div>


      <!-- Login Form -->
      <form id="loginForm">

        <div class="form-group">

          <label for="userId">
            Registration ID
          </label>

          <input
            type="text"
            id="userId"
            placeholder="Enter your registration ID"
            autocomplete="username"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <!-- Login Status -->
        <div
          id="formStatus"
          class="form-status"
          style="display: none;">
        </div>


        <!-- Submit -->
        <button
          type="submit"
          class="login-submit">
          Sign in as Doctor
        </button>

      </form>


      <!-- Selected Role -->
      <div class="login-footer">

        <span>Signing in as</span>

        <strong id="roleLabel">
          Doctor
        </strong>

      </div>

    </div>

  </main>


  <!-- JavaScript -->
  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>

</body>
</html>
