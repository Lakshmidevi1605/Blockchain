<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Report — RxChain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/patient.css">
<link rel="stylesheet" href="../../css/doctor.css">
</head>
<body class="dash-body">

<div class="dash-shell">
  <aside class="dash-sidebar">
    <a href="../../index.html" class="dash-brand"><span class="brand-mark">Rx</span>RxChain</a>
    <span class="dash-role-badge">Patient</span>
    <ul class="dash-nav">
      <li><a href="patient-dashboard.html"><span class="nav-icon">▤</span>Dashboard</a></li>
      <li><a href="my-prescriptions.html"><span class="nav-icon">☰</span>My Prescriptions</a></li>
      <li><a href="qr-code.html"><span class="nav-icon">▦</span>My QR Code</a></li>
    </ul>
    <div class="dash-sidebar-footer">
      <div class="dash-user"><span class="u-name" id="sbUserName">—</span><span class="u-role">Patient</span></div>
      <a href="#" class="dash-signout" id="signOutBtn">Sign out</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <h1>AI report</h1>
        <p class="sub" id="rxSub">A plain-language summary your doctor generated for this prescription.</p>
      </div>
      <a href="my-prescriptions.html" class="btn btn-ghost">← Back</a>
    </div>

    <div class="panel" id="panelWrap" style="max-width:640px; display:none;">
      <span class="ai-risk" id="riskTag"></span>
      <h2 style="margin:14px 0;">What this means for you</h2>
      <p id="summaryText" style="margin-bottom:18px;"></p>
      <ul id="findingsList" style="margin:0 0 8px 18px; padding:0; font-size:0.92rem;"></ul>
    </div>

    <div class="empty-state" id="noReport" style="display:none;">No AI report is available for this prescription yet.</div>
  </main>
</div>

<script src="../../js/doctor/blockchain.js"></script>
<script>
  const session = RxChain.requireRole("patient", "../../login.html");
  document.getElementById("sbUserName").textContent = session.userId;
  document.getElementById("signOutBtn").addEventListener("click", (e) => {
    e.preventDefault();
    RxChain.signOut("../../login.html");
  });

  const id = new URLSearchParams(window.location.search).get("id");
  const rx = id ? RxChain.getById(id) : null;

  if (rx) document.getElementById("rxSub").textContent = `${rx.id} — ${rx.medication}`;

  if (!rx || !rx.aiReport) {
    document.getElementById("noReport").style.display = "block";
  } else {
    const report = rx.aiReport;
    document.getElementById("panelWrap").style.display = "block";
    const tag = document.getElementById("riskTag");
    tag.textContent = report.risk.charAt(0).toUpperCase() + report.risk.slice(1) + " risk";
    tag.className = "ai-risk " + report.risk;
    document.getElementById("summaryText").textContent = report.summary;
    const list = document.getElementById("findingsList");
    report.findings.forEach((f) => {
      const li = document.createElement("li");
      li.textContent = f;
      list.appendChild(li);
    });
  }
</script>
</body>
</html>
