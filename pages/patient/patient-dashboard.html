<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Dashboard — RxChain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/patient.css">
</head>
<body class="dash-body">

<div class="dash-shell">
  <aside class="dash-sidebar">
    <a href="../../index.html" class="dash-brand"><span class="brand-mark">Rx</span>RxChain</a>
    <span class="dash-role-badge">Patient</span>
    <ul class="dash-nav">
      <li><a href="patient-dashboard.html" class="active"><span class="nav-icon">▤</span>Dashboard</a></li>
      <li><a href="my-prescriptions.html"><span class="nav-icon">☰</span>My Prescriptions</a></li>
      <li><a href="qr-code.html"><span class="nav-icon">▦</span>My QR Code</a></li>
    </ul>
    <div class="dash-sidebar-footer">
      <div class="dash-user"><span class="u-name" id="sbUserName">—</span><span class="u-role">Patient</span></div>
      <a href="#" class="dash-signout" id="signOutBtn">Sign out</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <h1>Your prescriptions</h1>
        <p class="sub">Everything your doctors have prescribed, verified on the chain.</p>
      </div>
      <a href="qr-code.html" class="btn btn-primary">Show my QR</a>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><span class="label">Total</span><span class="value" id="statTotal">0</span></div>
      <div class="stat-card"><span class="label">Active</span><span class="value accent" id="statActive">0</span></div>
      <div class="stat-card"><span class="label">Dispensed</span><span class="value" id="statDispensed">0</span></div>
      <div class="stat-card"><span class="label">Prescribing doctors</span><span class="value" id="statDoctors">0</span></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Active prescriptions</h2>
        <a href="my-prescriptions.html" class="btn btn-outline btn-sm">View all</a>
      </div>
      <div id="activeList"></div>
      <div class="empty-state" id="emptyState" style="display:none;">No active prescriptions right now.</div>
    </div>
  </main>
</div>

<script src="../../js/doctor/blockchain.js"></script>
<script src="../../js/patient/patient-dashboard.js"></script>
</body>
</html>
